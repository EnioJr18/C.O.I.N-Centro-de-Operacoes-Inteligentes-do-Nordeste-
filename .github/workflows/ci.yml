name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql://coin_ci:coin_ci@localhost:5432/coin_ci
      DJANGO_SETTINGS_MODULE: config.settings.test

    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: coin_ci
          POSTGRES_USER: coin_ci
          POSTGRES_PASSWORD: coin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coin_ci -d coin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install GDAL, GEOS, and PROJ
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show Python tooling
        run: |
          python --version
          python -m pip --version

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Verify GeoDjango native libraries
        run: |
          python -c "from django.contrib.gis.gdal import GDAL_VERSION; print(GDAL_VERSION)"
          python -c "from django.contrib.gis.geos import geos_version; print(geos_version())"

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Verify PostGIS service
        run: >-
          python -c "import django; django.setup(); from django.db import connection;
          cursor = connection.cursor(); cursor.execute('SELECT postgis_full_version()');
          print(cursor.fetchone()[0]); cursor.close()"

      - name: Compile Python sources
        run: python -m compileall -q apps config manage.py

      - name: Check Git diff formatting
        run: git diff --check

      - name: Run Django test suite
        run: python manage.py test

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Redis dependencies
        run: python -m pip check

      - name: Run multiprocess Redis smoke test
        run: python scripts/redis_channel_smoke.py
